name: Detect new digital resident programs

on:
  schedule:
    - cron: "43 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-program-data
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect candidates
        id: detect
        continue-on-error: true
        run: npm run detect:programs
        env:
          SEARCH_PROVIDER: gemini
          GEMINI_SEARCH_MODEL: ${{ vars.GEMINI_SEARCH_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          GOOGLE_SEARCH_ENGINE_ID: ${{ secrets.GOOGLE_SEARCH_ENGINE_ID }}

      - name: Validate candidates and publish verified new municipalities
        run: npm run publish:programs

      - name: Test publication and build changed public data
        run: |
          npm run data:validate
          npm run test:updates
          if ! git diff --quiet -- src/data/autoMunicipalities.json; then npm run build; fi

      - name: Save verified publications and search status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/detectedMunicipalities.json src/data/autoMunicipalities.json public/data/discovery-status.json public/data/publication-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update discovery candidates and search status'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report failed search
        if: steps.detect.outcome == 'failure'
        run: exit 1
