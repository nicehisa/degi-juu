name: Research and validate municipality data
on:
  schedule:
    - cron: "47 22 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "src/data/**"
      - "src/lib/municipalityImages.ts"
      - "scripts/**"
      - "package*.json"
      - ".github/workflows/research-municipality-data.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run data:validate
      - run: npm run test:updates
  research:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: daily-program-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Discover unpublished candidates
        id: discover
        continue-on-error: true
        run: npm run data:discover
      - name: Check published sources
        id: check
        continue-on-error: true
        run: npm run data:check -- --alert-on-change
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: municipality-research-reports
          path: |
            data/candidates.json
            data/discovery-report.json
            data/municipality-checks.json
          retention-days: 14
      - name: Preserve candidates and comparison baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in data/candidates.json data/discovery-report.json data/municipality-checks.json; do
            if [ -f "$file" ]; then git add "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update municipality research reports'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report research warnings
        if: steps.discover.outcome == 'failure' || steps.check.outcome == 'failure'
        run: exit 1
