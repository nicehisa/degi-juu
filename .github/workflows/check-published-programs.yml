name: Check published digital resident programs
on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: published-program-checks
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check official pages
        id: check
        continue-on-error: true
        run: npm run check:programs
      - name: Publish check results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/program-checks.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update daily official page checks'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report failed checks
        if: steps.check.outcome == 'failure'
        run: exit 1
